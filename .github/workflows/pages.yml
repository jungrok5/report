name: Publish example report
on:
  push:
    branches: [main]
    paths: ['docs/**', 'skills/**', 'web/**', 'tools/**', 'tests/**', 'package*.json', 'vite.config.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify pinned ai-design bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('skills/investigate-game-incident/vendor/ai-design')
          manifest = json.loads((root / 'UPSTREAM.json').read_text())
          for name, expected in manifest['files_sha256'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Check report prose and UI with pinned ai-design
        run: npm run style
      - name: Validate reports and exact archived evidence
        run: |
          python3 -m unittest discover -s skills/investigate-game-incident/scripts -p 'test_*.py' -v
          python3 tests/check_demo.py
          python3 tests/check_cases.py
          npm run test:model
          python3 skills/investigate-game-incident/scripts/render_report.py skills/investigate-game-incident/assets/example-restart.json --out /tmp/report.html
          cmp /tmp/report.html docs/index.html
      - run: npm run build
      - name: Verify interactive and portable reports in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:app
          npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy example
        id: deployment
        uses: actions/deploy-pages@v4
