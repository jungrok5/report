name: Publish example report
on:
  push:
    branches: [main]
    paths: ['docs/**', 'skills/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate and render the synthetic example
        run: |
          python3 -m unittest discover -s skills/investigate-game-incident/scripts -p 'test_*.py' -v
          python3 tests/check_demo.py
          python3 skills/investigate-game-incident/scripts/render_report.py skills/investigate-game-incident/assets/example-restart.json --out /tmp/report.html
          cmp /tmp/report.html docs/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy example
        id: deployment
        uses: actions/deploy-pages@v4
