name: Validate reports
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify pinned ai-design bytes
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('skills/investigate-game-incident/vendor/ai-design')
          manifest = json.loads((root / 'UPSTREAM.json').read_text())
          for name, expected in manifest['files_sha256'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          PY
      - name: Check report prose and UI with pinned ai-design
        run: npm run style
      - name: Test collection, investigation and immutable report versions
        run: python3 -m unittest discover -s skills/investigate-game-incident/scripts -p 'test_*.py' -v
      - name: Check synthetic investigation and case archive drift
        run: |
          python3 tests/check_demo.py
          python3 tests/check_cases.py
          npm run test:model
      - name: Validate portable offline report
        run: |
          python3 skills/investigate-game-incident/scripts/validate_report.py skills/investigate-game-incident/assets/example-restart.json
          python3 skills/investigate-game-incident/scripts/render_report.py skills/investigate-game-incident/assets/example-restart.json --out /tmp/report.html --markdown-out /tmp/report.md
          cmp /tmp/report.html examples/restart-recovery.html
          cmp /tmp/report.html docs/index.html
          cmp /tmp/report.md examples/restart-recovery.md
          cmp /tmp/report.md docs/report.md
      - name: Build React Flow report page
        run: npm run build
      - name: Verify interactive and portable reports in Chromium
        run: |
          npx playwright install --with-deps chromium
          npm run test:app
          npm run test:browser
